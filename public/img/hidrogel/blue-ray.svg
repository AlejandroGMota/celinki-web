<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" font-family="Montserrat, Arial, sans-serif">
  <rect width="900" height="900" fill="#fff"/>
  <!-- Lámina Blue Ray LG-09, al estilo de las hojas KASR (120 × 180 mm) -->
  <g transform="translate(250 70)">
    <rect x="0" y="0" width="400" height="600" rx="20" fill="#fff" stroke="#d6dbe3" stroke-width="3"/>
    <text x="200" y="78" text-anchor="middle" font-size="54" font-weight="800" fill="#1e88e5" letter-spacing="4">KASR</text>
    <text x="200" y="122" text-anchor="middle" font-size="24" font-weight="800" fill="#1b1b1f">Resist Blue Ray</text>
    <text x="200" y="152" text-anchor="middle" font-size="20" font-weight="600" fill="#1b1b1f">To Protect Eyes</text>
    <rect x="140" y="170" width="120" height="34" rx="6" fill="#1e88e5"/>
    <text x="200" y="195" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">LG-09</text>
    <text x="24" y="240" font-size="22" fill="#9aa3af">«</text>
    <line x1="48" y1="234" x2="376" y2="234" stroke="#c4cad4" stroke-dasharray="8 6"/>
    <text x="200" y="256" text-anchor="middle" font-size="14" fill="#9aa3af">film starting line</text>
    <!-- ojo protegido: rayos azules que se detienen en la lámina -->
    <g transform="translate(200 380)">
      <g stroke="#1e88e5" stroke-width="6" stroke-linecap="round">
        <line x1="-150" y1="-70" x2="-70" y2="-34"/>
        <line x1="-160" y1="0" x2="-80" y2="0"/>
        <line x1="-150" y1="70" x2="-70" y2="34"/>
      </g>
      <rect x="-62" y="-80" width="12" height="160" rx="6" fill="#bfe0fb" stroke="#1e88e5" stroke-width="3"/>
      <path d="M-30 0 C0 -52 100 -52 130 0 C100 52 0 52 -30 0 Z" fill="none" stroke="#1b1b1f" stroke-width="7"/>
      <circle cx="50" cy="0" r="22" fill="#1b1b1f"/>
      <circle cx="58" cy="-8" r="6" fill="#fff"/>
    </g>
    <!-- íconos de características -->
    <g transform="translate(200 510)">
      <circle cx="-120" r="20" fill="#1e88e5"/>
      <circle cx="-60" r="20" fill="#8dc63f"/>
      <circle cx="0" r="20" fill="#26c6da"/>
      <circle cx="60" r="20" fill="#ab47bc"/>
      <circle cx="120" r="20" fill="#ef5350"/>
    </g>
    <text x="200" y="574" text-anchor="middle" font-size="16" fill="#9aa3af">120 × 180 mm</text>
  </g>
  <text x="450" y="740" text-anchor="middle" font-size="26" font-weight="800" fill="#1b1b1f">Filtra la luz azul de la pantalla</text>
  <text x="450" y="776" text-anchor="middle" font-size="20" fill="#6b7280">Menos cansancio visual · transparente</text>
</svg>
