<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" font-family="Montserrat, Arial, sans-serif">
  <!-- Paso 3: la cortadora KASR corta la mica a la medida -->
  <rect width="320" height="220" rx="18" fill="#f4f9ec"/>
  <g transform="translate(36 60)">
    <!-- cuerpo de la máquina -->
    <rect x="0" y="30" width="248" height="86" rx="22" fill="#fff" stroke="#c4cad4" stroke-width="2"/>
    <rect x="34" y="8" width="160" height="44" rx="10" fill="#eef1f5" stroke="#c4cad4" stroke-width="2"/>
    <!-- pantalla -->
    <rect x="200" y="40" width="34" height="50" rx="6" fill="#0d2f7a"/>
    <rect x="204" y="44" width="26" height="42" rx="4" fill="#5aa3ff"/>
    <rect x="208" y="50" width="18" height="10" rx="2" fill="#fff" opacity=".8"/>
    <text x="14" y="72" font-size="14" font-weight="800" fill="#1e88e5">KASR</text>
    <!-- lámina saliendo con la silueta cortada -->
    <rect x="62" y="70" width="120" height="70" rx="4" fill="#fff" stroke="#8dc63f" stroke-width="2"/>
    <rect x="98" y="78" width="48" height="56" rx="10" fill="none" stroke="#1b1b1f" stroke-width="2" stroke-dasharray="5 4"/>
    <!-- cabezal con cuchilla -->
    <g transform="translate(146 70)">
      <rect x="-10" y="-30" width="20" height="26" rx="4" fill="#1b1b1f"/>
      <path d="M-4 -4 L4 -4 L0 6 Z" fill="#1b1b1f"/>
      <circle cx="0" cy="8" r="3" fill="#8dc63f"/>
    </g>
  </g>
  <!-- chispitas de corte -->
  <g stroke="#8dc63f" stroke-width="3" stroke-linecap="round">
    <path d="M196 132 l8 -6 M200 140 l10 0 M196 148 l8 6"/>
  </g>
  <text x="160" y="40" text-anchor="middle" font-size="13" font-weight="800" fill="#1b1b1f">Miles de modelos</text>
</svg>
