<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" font-family="Montserrat, Arial, sans-serif">
  <!-- Paso 1: pedido por WhatsApp -->
  <rect width="320" height="220" rx="18" fill="#f4f9ec"/>
  <g transform="translate(108 18)">
    <rect width="104" height="190" rx="16" fill="#1b1b1f"/>
    <rect x="6" y="8" width="92" height="174" rx="11" fill="#e9f7ef"/>
    <rect x="6" y="8" width="92" height="22" rx="11" fill="#25d366"/>
    <rect x="6" y="20" width="92" height="10" fill="#25d366"/>
    <circle cx="20" cy="19" r="6" fill="#fff"/>
    <rect x="30" y="16" width="40" height="6" rx="3" fill="#fff"/>
    <!-- mensaje del cliente -->
    <rect x="30" y="40" width="62" height="36" rx="8" fill="#dcf8c6"/>
    <text x="35" y="54" font-size="8.5" font-weight="700" fill="#1b1b1f">10 HD</text>
    <text x="35" y="66" font-size="7.5" fill="#1b1b1f">iPhone 15</text>
    <rect x="30" y="82" width="62" height="36" rx="8" fill="#dcf8c6"/>
    <text x="35" y="96" font-size="8.5" font-weight="700" fill="#1b1b1f">5 privacidad</text>
    <text x="35" y="108" font-size="7.5" fill="#1b1b1f">Galaxy A55</text>
    <!-- respuesta -->
    <rect x="12" y="124" width="62" height="26" rx="8" fill="#fff"/>
    <text x="17" y="141" font-size="8.5" font-weight="700" fill="#1b1b1f">¡Listo! 👍</text>
  </g>
  <!-- burbuja de WhatsApp -->
  <g transform="translate(232 30)">
    <circle r="26" fill="#25d366"/>
    <path d="M-11 13 l3 -9 a12 12 0 1 1 5 5 z" fill="#fff"/>
  </g>
</svg>
