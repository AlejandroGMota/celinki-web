<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" font-family="Montserrat, Arial, sans-serif">
  <!-- Paso 4: entrega gratis en Pachuca y Mineral de la Reforma -->
  <rect width="320" height="220" rx="18" fill="#f4f9ec"/>
  <!-- camino -->
  <path d="M0 176 H320" stroke="#dbe3c8" stroke-width="16"/>
  <path d="M10 176 H310" stroke="#fff" stroke-width="3" stroke-dasharray="14 10"/>
  <!-- camioneta -->
  <g transform="translate(62 104)">
    <rect x="0" y="10" width="110" height="56" rx="8" fill="#8dc63f"/>
    <path d="M110 22 H140 L160 44 V66 H110 Z" fill="#6fa22c"/>
    <path d="M116 28 H138 L152 44 H116 Z" fill="#e7f3d6"/>
    <text x="55" y="44" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">GRATIS</text>
    <circle cx="28" cy="70" r="13" fill="#1b1b1f"/><circle cx="28" cy="70" r="5" fill="#fff"/>
    <circle cx="130" cy="70" r="13" fill="#1b1b1f"/><circle cx="130" cy="70" r="5" fill="#fff"/>
  </g>
  <!-- pines de destino -->
  <g transform="translate(250 34)">
    <path d="M0 52 C-22 26 -22 4 0 4 C22 4 22 26 0 52 Z" fill="#8dc63f"/>
    <circle cy="22" r="8" fill="#fff"/>
  </g>
  <g transform="translate(284 64)">
    <path d="M0 40 C-17 20 -17 3 0 3 C17 3 17 20 0 40 Z" fill="#b8893a"/>
    <circle cy="17" r="6" fill="#fff"/>
  </g>
  <text x="18" y="40" font-size="13" font-weight="800" fill="#1b1b1f">Pachuca</text>
  <text x="18" y="58" font-size="13" font-weight="800" fill="#1b1b1f">Mineral de la Reforma</text>
  <text x="18" y="80" font-size="11" fill="#6b7280">desde 50 piezas · 30 de privacidad</text>
</svg>
