<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" font-family="Montserrat, Arial, sans-serif">
  <!-- Paso 2: cortada a tu modelo o lámina, mismo precio -->
  <rect width="320" height="220" rx="18" fill="#f4f9ec"/>
  <!-- izquierda: mica cortada con silueta de celular -->
  <g transform="translate(30 30)">
    <rect width="100" height="140" rx="10" fill="#fff" stroke="#c4cad4" stroke-width="2"/>
    <rect x="22" y="14" width="56" height="112" rx="12" fill="#e7f3d6" stroke="#8dc63f" stroke-width="2.5" stroke-dasharray="6 4"/>
    <rect x="40" y="20" width="20" height="5" rx="2.5" fill="#8dc63f"/>
    <!-- tijeras -->
    <g transform="translate(88 118) rotate(-35)" fill="none" stroke="#1b1b1f" stroke-width="3">
      <circle cx="-8" cy="12" r="6"/><circle cx="8" cy="12" r="6"/>
      <path d="M-4 7 L6 -16 M4 7 L-6 -16" stroke-linecap="round"/>
    </g>
    <text x="50" y="164" text-anchor="middle" font-size="13" font-weight="800" fill="#1b1b1f">Cortada</text>
  </g>
  <!-- centro: = -->
  <g transform="translate(160 96)">
    <circle r="20" fill="#1b1b1f"/>
    <text y="7" text-anchor="middle" font-size="22" font-weight="800" fill="#8dc63f">=</text>
  </g>
  <!-- derecha: láminas apiladas -->
  <g transform="translate(192 34)">
    <rect x="12" y="0" width="92" height="132" rx="8" fill="#fff" stroke="#c4cad4" stroke-width="2"/>
    <rect x="6" y="6" width="92" height="132" rx="8" fill="#fff" stroke="#c4cad4" stroke-width="2"/>
    <rect x="0" y="12" width="92" height="132" rx="8" fill="#fff" stroke="#8dc63f" stroke-width="2.5"/>
    <rect x="0" y="12" width="14" height="132" rx="7" fill="#8dc63f"/>
    <text x="54" y="50" text-anchor="middle" font-size="14" font-weight="800" fill="#8dc63f">KASR</text>
    <rect x="30" y="60" width="48" height="10" rx="3" fill="#e7f3d6"/>
    <rect x="30" y="76" width="36" height="8" rx="3" fill="#eef1f5"/>
    <text x="46" y="160" text-anchor="middle" font-size="13" font-weight="800" fill="#1b1b1f">Lámina</text>
  </g>
  <text x="160" y="208" text-anchor="middle" font-size="13" font-weight="800" fill="#6fa22c">MISMO PRECIO</text>
</svg>
