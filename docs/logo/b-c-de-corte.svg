    <circle r="82" fill="#8dc63f"/>
    <path d="M38 -46 A60 60 0 1 0 38 46" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round"/>
    <path d="M38 -46 A60 60 0 1 0 38 46" fill="none" stroke="#1b1b1f" stroke-width="3" stroke-dasharray="9 7" transform="scale(1.32)" opacity=".55"/>
