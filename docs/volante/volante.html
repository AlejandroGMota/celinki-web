<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Celinki · volante 4 por hoja (carta)</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* Hoja carta en puntos (612 × 792). Al imprimir desde el navegador se escala a 8.5 × 11 in. */
  @page { size: letter; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; }
  body { font-family: Montserrat, 'Avenir Next', Arial, sans-serif; color: #1b1b1f; }
  .hoja { width: 612px; height: 792px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; position: relative; }
  @media print { .hoja { zoom: 1.3333; } }
  /* líneas de corte */
  .hoja::before, .hoja::after { content: ''; position: absolute; border: 0 dashed #bbb; }
  .hoja::before { left: 306px; top: 0; bottom: 0; border-left-width: 0.6px; }
  .hoja::after { top: 396px; left: 0; right: 0; border-top-width: 0.6px; }

  .vol { padding: 22px 22px 22px; display: flex; flex-direction: column; gap: 7px; overflow: hidden; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 5px; font-weight: 800; font-size: 17px; letter-spacing: -0.3px; }
  .logo img { width: 16px; height: 16px; }
  .tag { font-size: 7.5px; font-weight: 700; letter-spacing: 1.5px; color: #6fa22c; text-transform: uppercase; }
  h1 { font-family: 'Times New Roman', Georgia, serif; font-size: 23px; line-height: 1; color: #6fa22c; text-transform: uppercase; }
  .sub { font-size: 9.5px; line-height: 1.35; }
  .sub b { color: #1b1b1f; }

  .tipos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .tipo { border: 1px solid #e5e8ee; border-top: 3px solid var(--c); border-radius: 6px; padding: 3px 3px 4px; text-align: center; }
  .tipo img { width: 100%; height: 36px; object-fit: contain; display: block; }
  .tipo span { display: block; font-size: 7px; font-weight: 800; line-height: 1.1; margin-top: 2px; }

  .entrega { display: flex; gap: 7px; align-items: center; background: #f4f9ec; border: 1.2px solid #8dc63f; border-radius: 8px; padding: 6px 8px; }
  .entrega .camion { font-size: 18px; }
  .entrega b { display: block; font-size: 10.5px; color: #3f6b12; }
  .entrega .lugares { display: flex; align-items: center; gap: 3px; font-size: 8.5px; font-weight: 800; margin-top: 1px; }
  .entrega .lugares img { width: 13px; height: 13px; }
  .entrega small { display: block; font-size: 7px; color: #6b7280; margin-top: 1px; }

  .pie { margin-top: auto; display: flex; gap: 10px; align-items: center; }
  .qr { width: 70px; height: 70px; flex: none; image-rendering: pixelated; }
  .contacto { display: flex; flex-direction: column; gap: 3px; }
  .contacto .web { font-size: 12px; font-weight: 800; }
  .contacto .esc { font-size: 7.5px; color: #6b7280; }
  .tel { display: inline-flex; align-items: center; gap: 4px; background: #25d366; color: #052e16; font-weight: 800; font-size: 11px; border-radius: 999px; padding: 4px 9px; align-self: flex-start; }
  .contacto .precios { font-size: 7.5px; font-weight: 700; }
</style>
</head>
<body>
<div class="hoja" id="hoja"></div>

<template id="vol">
  <section class="vol">
    <div class="top">
      <div class="logo"><img src="../../public/favicon.svg" alt=""> celinki</div>
      <div class="tag">Hidrogel KASR</div>
    </div>
    <h1>Micas de hidrogel</h1>
    <p class="sub">Cortadas al tamaño del modelo que elijas o en lámina sin corte, a mayoreo. <b>Mismo precio.</b></p>

    <div class="tipos">
      <div class="tipo" style="--c:#8dc63f"><img src="../../public/img/hidrogel/hd.jpg" alt=""><span>HD</span></div>
      <div class="tipo" style="--c:#b8893a"><img src="../../public/img/hidrogel/mate.jpg" alt=""><span>Mate</span></div>
      <div class="tipo" style="--c:#1e88e5"><img src="../../public/img/hidrogel/blue-ray.svg" alt=""><span>Blue Ray</span></div>
      <div class="tipo" style="--c:#1b1b1f"><img src="../../public/img/hidrogel/privacidad-mate.jpg" alt=""><span>Privacidad Mate</span></div>
      <div class="tipo" style="--c:#1b1b1f"><img src="../../public/img/hidrogel/privacidad-hd.jpg" alt=""><span>Privacidad HD</span></div>
      <div class="tipo" style="--c:#c62828"><img src="../../public/img/hidrogel/privacidad-360.jpg" alt=""><span>Privacidad 360°</span></div>
      <div class="tipo" style="--c:#8dc63f"><img src="../../public/img/hidrogel/tablet-11-hd.jpg" alt=""><span>Tablet 11" y 13"</span></div>
      <div class="tipo" style="--c:#1b1b1f"><img src="../../public/img/hidrogel/tablet-13-privacidad.jpg" alt=""><span>Tablet privacidad</span></div>
    </div>

    <div class="entrega">
      <span class="camion">🚚</span>
      <div>
        <b>Entrega gratis</b>
        <div class="lugares"><img src="../../public/img/iconos/pachuca-reloj.svg" alt=""> Pachuca <img src="../../public/img/iconos/mineral-castillete.svg" alt=""> Mineral de la Reforma</div>
        <small>Desde 50 piezas o 30 de privacidad</small>
      </div>
    </div>

    <div class="pie">
      <img class="qr" src="qr-celinki.png" alt="QR a celinki.com">
      <div class="contacto">
        <span class="esc">Escanea y ve todos los tipos</span>
        <span class="web">celinki.com</span>
        <span class="precios">Precios y pedidos por WhatsApp:</span>
        <span class="tel">771 868 2542</span>
      </div>
    </div>
  </section>
</template>
<script>
  const t = document.getElementById('vol'), h = document.getElementById('hoja');
  for (let i = 0; i < 4; i++) h.appendChild(t.content.cloneNode(true));
</script>
</body>
</html>
